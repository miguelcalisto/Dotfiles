
" Dracula-inspired and extended color palette
" Usado para testar visualmente no Vim

" ----- Base Colors -----
let g:color_fg        = "#f8f8f2"  " Branco gelo (padrão do tema)
let g:color_bg        = "#282a36"  " Fundo base
let g:color_bg_alt    = "#44475a"  " Fundo alternativo

" ----- Destaques -----
let g:color_primary   = "#bd93f9"  " Roxo/lilás
let g:color_secondary = "#ffb86c"  " Laranja pastel
let g:color_alert     = "#ff5555"  " Vermelho vivo
let g:color_disabled  = "#6272a4"  " Azul escuro acinzentado

" ----- Verdes -----
let g:green_default   = "#50fa7b"  " Verde vibrante (Dracula)
let g:green_mint      = "#69ff94"  " Verde menta suave
let g:green_soft      = "#8affc1"  " Verde bem suave
let g:green_pastel    = "#a8ffcc"  " Verde pastel quase branco
let g:green_grayish   = "#7bd8a3"  " Verde acinzentado suave

" ----- Extras -----
let g:yellow_soft     = "#f1fa8c"  " Amarelo claro
let g:blue_soft       = "#8be9fd"  " Azul bebê
let g:pink_soft       = "#ff79c6"  " Rosa suave
let g:white_pure      = "#ffffff"  " Branco puro
let g:red_pure        = "#ff0000"  " Vermelho puro


