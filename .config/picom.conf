
backend = "glx";  # você também pode testar com "xrender" se GLX tiver problemas
vsync = true;

inactive-opacity = 0.9;
active-opacity = 0.95;

opacity-rule = [
  "90:class_g = 'Tilix'",
  "90:class_g = 'Alacritty'"
];

blur:
{
  method = "dual_kawase";
  strength = 7;  # experimente valores entre 3–10
  background = false;
};

